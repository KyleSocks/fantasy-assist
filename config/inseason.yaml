# Mid-season assistant settings (src/inseason/).
#
# Blended per-game rate for every stat:
#     blended = (preseason_rate * K + season_to_date_total) / (K + games)
# K is the prior strength in games (starts for goalies): at games == K the
# season so far and the preseason projection count equally. Small K = trust
# this season quickly (stats that stabilise fast: shots, hits, blocks);
# large K = lean on the projection (goals, shutouts are noisy).
# These are starting values, not fitted -- see the follow-up prompt for a
# backtest that tunes them.
skater_k_games:
  goals: 40
  assists: 30
  pp_points: 30
  sh_points: 60       # shorthanded points: rare, very noisy
  shots: 15
  hits: 10
  blocks: 10
# Goals = blended shots x blended shooting %. Shooting % blends toward his
# projected % with this many shots of prior (it takes ~300-400 shots to
# settle), so a lucky or unlucky finishing stretch moves his goal rate
# far less than his shot volume does. Remove the key to blend goals per
# game directly with skater_k_games.goals instead.
skater_sh_pct_k_shots: 375
# Deployment (src/inseason/deploy.py): his expected ice time from here on
# blends the season average with the last 7 days (and the power-play time
# of his last game, from shift charts), k games of season prior; rates
# tied to that ice time scale with it, within [min, max] of normal.
deployment:
  k_games: 6
  last_game_weight: 2     # the last game's PP time counts as this many games
  min_factor: 0.6
  max_factor: 1.6
# Goalies: on the second night of a back-to-back the usual starter starts
# this fraction as often as usual; the rest goes to his partner(s).
goalie_b2b_starter_factor: 0.5
goalie_k_starts:
  wins: 20
  saves: 15
  goals_against: 15   # unused: GA = shots against x (1 - blended SV%), see model.py
  shutouts: 40
# save_pct blends in shots against, same units as regression.yaml's k.
goalie_save_pct_k_shots: 1000
# Share of team games a goalie starts.
start_share_k_games: 10
# Opponent strength (goals/shots against and for per game) regresses to the
# league mean with this many games of league-average prior.
opponent_k_games: 10
# A night with this many NHL games or fewer counts as an "off-night".
off_night_max_games: 7
# Goalie single-game streams are valued as if he STARTS that game (you'd
# only stream a confirmed starter), but goalies who start fewer than this
# share of their team's games (third-stringers, call-ups) aren't listed.
stream_goalie_min_start_share: 0.15
# Replacement level per group = the Nth best healthy free agent in your
# league (data/fa.txt). 1 = the single best one: the hottest start on the
# wire sets the bar, most of a roster reads DROP CANDIDATE and no free
# agent can read HOLD. A few ranks down is a level you can reliably get.
replacement_fa_rank:
  F: 5
  D: 3
  G: 2
# Trend column: production over the last this-many days (pulled on every
# refresh) vs his blended rate. Fewer than trend_min_games games in the
# window -> no trend shown.
trend_days: 21
trend_min_games: 3
# hold check: ROS per-game value at least this fraction above replacement
# is a HOLD regardless of the short window.
hold_margin: 0.05   # was 0.15: lenient, so a HOLD turning BORDERLINE means a real slip
# ... and a DROP CANDIDATE only when at least this fraction BELOW it; in
# between is BORDERLINE. 0 = anything under the bar is a drop candidate,
# which flips on a game or two of noise.
drop_margin: 0.15
# Streaming plan: a HOLD is never dropped for streamers (drops are free but
# final). The exception is severe underperformance: at least this many games
# played AND season-to-date per-game value below replacement.
protect_min_gp: 15
# Trade explorer: how the "market" (a typical manager) values a player.
# From Yahoo (pulled by Refresh into data/market.json), each a percentile
# within F / D / G, weighted:
#   rostered: % of all Yahoo leagues rostering him
#   points:   Yahoo Fan Pts this season (see market_points)
#   name:     Yahoo pre-season rank (reputation)
market_weights:
  rostered: 0.5
  points: 0.3
  name: 0.2
# "total" = season Fan Pts as Yahoo's trade screen shows them (a player who
# missed games looks worse, as he does to the other manager); "per_game".
market_points: total
# Fallback for players with no Yahoo data: season-to-date production with
# only this many games of preseason prior (the model above uses 10-60).
market_k_games: 5
# Refresh button / src.inseason.yahoo_public: your public Yahoo league.
# This is the default; a league config with its own yahoo: block (see the
# README, "More than one league") follows that league instead.
# league_id and team_id are in the team page URL:
#   hockey.fantasysports.yahoo.com/hockey/<league_id>/<team_id>
yahoo:
  league_id: 19725
  team_id: 5
  free_agent_pages: 0   # 0 = every available player (free agents, waivers,
                        # injured). N = top N pages (25 each) by current
                        # rank + top N by preseason rank (faster)
# Rest-of-season values (hold checks, trades) run to the end of the league's
# fantasy playoffs (playoff_window in the league yaml), and a game in that
# window counts this many times: those weeks decide the title. 1 = no extra
# weight. A judgment call -- raise it once your playoff spot is safe.
playoff_game_weight: 2.0
# What you're playing for (also a picker in the trade tools):
#   auto           from your playoff odds (standings on Refresh): 90%+ ->
#                  playoffs, 50%+ -> balanced, below -> make_playoffs
#   make_playoffs  every game counts the same
#   balanced       playoff games x playoff_game_weight
#   playoffs       your playoff spot is safe: regular-season games count
#                  contender_regular_weight, playoff games
#                  contender_playoff_weight. Trades for an injured star who's
#                  back before the playoffs rank high even if you lose
#                  points until then.
trade_focus: auto
contender_regular_weight: 0.25
contender_playoff_weight: 3.0
# Playoff odds (src/inseason/standings.py): simulated rest of the regular
# season from points-for per week, pulled toward the league average.
standings:
  safe_odds: 0.90      # auto focus -> playoffs at or above
  bubble_odds: 0.50    # auto focus -> balanced at or above, else make_playoffs
  week_sd_pct: 0.18    # weekly score spread, share of the league average
  k_weeks: 3           # weeks of league average mixed into points-for
  sims: 4000
# Skaters: share of team games played (injuries, scratches) blends the
# projection's durability with this season's games played / team games.
play_share_k_games: 20
# false: don't guess injuries from this season's missed games. A skater's
# share is then his projection's: the same flat share for everyone except
# players with a long record of missed time (config/regression.yaml gp_*).
# Goalies' start share always uses this season (start_share_k_games).
play_share_use_season: false
# share for a skater with no projection (rookies); match gp_healthy_share
play_share_unprojected: 0.88
# false: skaters count at 100% of their team's games -- no discount for
# expected missed games. You have IR slots and can stream a short-term
# fill-in, so a player who might get hurt isn't worth less per game while
# he plays. (Players listed OUT are still handled as out.) The shares above
# still show in a player's card. Goalies always use their start share.
skater_play_share: false
# Advanced stats (src/inseason/advanced.py). On-ice shooting % at 5v5 --
# how often linemates' shots go in with him on the ice -- is compared with
# what the players he's actually been on the ice with this season shoot
# over their careers (shift charts x past seasons), and the gap is mostly
# luck: it's regressed toward that baseline before it counts toward his
# 5v5 assists. k = on-ice shots of the baseline mixed in (defencemen
# larger). Remove onice_sh_pct_k_shots to turn the adjustment off (the
# stats still show in player cards).
advanced:
  onice_shots_per_60: 28      # league-typical 5v5 shots for per 60
  onice_sh_pct_k_shots: {F: 1000, D: 2000}
  career_sh_pct_k_shots: 100  # position-average shots mixed into a career SH%
  # expected goals (xg.py): his xG per shot on goal this season is mixed into
  # the shooting % the projection starts from, with this many shots of the
  # preseason figure. Remove to show xG without changing projections.
  xg_k_shots: 150
  onice_flag_pts: 0.025       # on-ice SH% this far from league is worth a note
  onice_flag_shots: 100
# Alerts about your team (injury tags, IR moves, line / PP changes, your
# goalie on a back-to-back, free agents promoted to PP1) are made on every
# Refresh and listed on the Roster tab. Set a URL to also get them as phone
# notifications: an ntfy topic (https://ntfy.sh/<a-long-random-topic>, or
# your own ntfy server) or any endpoint that takes a plain-text POST.
alerts:
  url: ""
