# Shrinkage parameters (k) for Bayesian regression of per-GP rates toward positional means.
# k represents the equivalent number of games of a "typical" player in that category.
# Tuned 2026-09-14: k=14 optimal for all categories (MSE backtest, 2022-2025 seasons).
goals: 14
assists: 14
shots: 14
blocks: 14
hits: 14
pp_points: 14
goalie_save_pct: 1000

# Level curves L(age), peak-normalized to 1.00. Age adjustment is the ratio
# L(projected_age) / L(obs_age), where obs_age is the season-weighted mean
# age across the observed seasons (same weights as the rate computation).
# Forwards peak at 25-26; the defensemen curve is the same shape shifted
# +2 years, peaking at 27-28. Ages below/above the table clamp to the
# nearest entry; fractional ages interpolate linearly. Goalies use flat
# 1.00 (no goalie curve).
level_curves:
  forwards:
    18: 0.78
    19: 0.82
    20: 0.86
    21: 0.90
    22: 0.94
    23: 0.97
    24: 0.99
    25: 1.00
    26: 1.00
    27: 0.99
    28: 0.97
    29: 0.95
    30: 0.92
    31: 0.89
    32: 0.85
    33: 0.81
    34: 0.77
    35: 0.72
    36: 0.67
    37: 0.62
    38: 0.57
  defensemen:
    20: 0.78
    21: 0.82
