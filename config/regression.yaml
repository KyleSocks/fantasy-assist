# Shrinkage parameters (k) for Bayesian regression of PER-60 rates toward
# positional per-60 means (src/projections/skaters.py). k is PER-STAT and
# must be expressed in the same units as that stat's sample size n:
#   goals      projected as shots x shooting %; this k is for shooting %:
#              n = CAREER shots     -> k in equivalent shots
#   assists    n = total TOI-minutes    -> k in equivalent TOI-minutes
#   shots      n = total TOI-minutes    -> k in equivalent TOI-minutes
#   blocks     n = total TOI-minutes    -> k in equivalent TOI-minutes
#   hits       n = total TOI-minutes    -> k in equivalent TOI-minutes
#   pp_points  n = total PP TOI-minutes -> k in equivalent PP TOI-minutes
# Games played is never a denominator. Every stat needs its own entry: the
# model raises if a stat is missing instead of falling back to a shared k.
goals: 200
assists: 300
shots: 150
blocks: 250
hits: 250
pp_points: 120
# Shorthanded points (league stat SHP): n = total TOI-minutes. Rare and
# noisy, so a large k leans hard on the positional mean.
sh_points: 600
# Goalie stats, same per-stat k/n rule (k in the same units as n):
#   starts     n = total games started across observed seasons -> k in starts
#   save_pct   n = total shots against across observed seasons -> k in shots
# Starts regress toward 0 (no floor); save_pct toward the pool mean.
goalie_save_pct_k: 1000
goalie_starts_k: 25
# Wins per start regress toward .500 with this many starts of weight.
goalie_win_rate_k: 40
# Wins per start = projected team win rate + the goalie's own edge over
# his teams' win rates, regressed toward 0 with goalie_win_rate_k starts
# (above). Clamped to these bounds.
goalie_win_rate_bounds: [0.15, 0.80]
# Shutouts per start: Poisson P(0 GA) = exp(-GA per start) x shutout_scale,
# blended with the goalie's own shutouts per start (this many starts of
# weight on the Poisson side).
shutout_scale: 1.0
# Shots faced per start = team shots against per game x the goalie's own
# (SA / GS) / team SA per game, regressed toward 1 with this many starts.
# Starters face a bit less than the team rate (pulled games), backups more.
goalie_sa_ratio_k: 40
# Share of each team's starts kept back for goalies outside the projected
# pool (call-ups, waiver claims); the pool splits the rest.
goalie_starts_reserve: 0.0
shutout_k_starts: 60

# Team context (src/projections/team_context.py). *_regress = share of a
# team's per-game deviation from league average carried into next season.
team_sa_regress: 0.6
team_win_regress: 0.6
team_gf_regress: 0.6
# Team win rate = team_hist_weight x regressed history
#               + (1 - team_hist_weight) x Pythagorean from the projected
#                 roster (GF from projected skater goals, GA from team shots
#                 against x (1 - projected goalie SV%)).
team_hist_weight: 0.5
pythag_exponent: 2.0

# Skaters: small-sample prior. Weight on the positional mean starts at
# rookie_prior_weight with 0 career GP and falls linearly to 0 at
# rookie_ramp_gp (was: 50/50 below 100 GP, nothing at 100+).
rookie_prior_weight: 0.5
rookie_ramp_gp: 200
# A skater whose team changed: pull projected PP TOI/GP this far toward the
# positional mean (new PP depth chart unknown).
team_change_pp_blend: 0.25

# Games played: share of team games, 5/3/2-weighted over the 3 most recent
# seasons with at least gp_min_season_gp games (call-ups are not injury
# evidence), regressed toward gp_prior_share with gp_prior_weight (5/3/2
# units), clamped to [gp_share_floor, 1]. Projected GP = 82 x share.
gp_min_season_gp: 10
gp_prior_share: 0.88
gp_prior_weight: 3.0
gp_share_floor: 0.40

# Goalies projected below this many starts are excluded from the
# draftable pool and ranked below every startable goalie.
min_startable_starts: 15

# Hard cap on any single goalie's projected starts. No NHL goalie starts
# 82 games; a team's starts must sum to its game count, and any
# remainder after capping is redistributed among the team's uncapped
# goalies (see _allocate_goalie_starts in src/projections/goalie_allocation.py).
max_goalie_starts: 68

# Level curves L(age), peak-normalized to 1.00. Age adjustment is the ratio
# L(projected_age) / L(obs_age), where obs_age is the season-weighted mean
# age across the observed seasons (same weights as the rate computation).
# Forwards peak at 25-26; the defensemen curve is the same shape shifted
# +2 years, peaking at 27-28. Ages below/above the table clamp to the
# nearest entry; fractional ages interpolate linearly. Goalies use flat
# 1.00 (no goalie curve).
#
# Optional, fitted from your database by `python -m src.projections.age_fit`
# (paste its output here): level_curves_by_stat (per-stat curves for
# forwards / defensemen; a stat without one uses the shared curve below) and
# goalie_sv_age (additive save-% levels by age).
level_curves:
  forwards:
    18: 0.78
    19: 0.82
    20: 0.86
    21: 0.90
    22: 0.94
    23: 0.97
    24: 0.99
    25: 1.00
    26: 1.00
    27: 0.99
    28: 0.97
    29: 0.95
    30: 0.92
    31: 0.89
    32: 0.85
    33: 0.81
    34: 0.77
    35: 0.72
    36: 0.67
    37: 0.62
    38: 0.57
  defensemen:
    20: 0.78
    21: 0.82
    22: 0.86
    23: 0.90
    24: 0.94
    25: 0.97
    26: 0.99
    27: 1.00
    28: 1.00
    29: 0.99
    30: 0.97
    31: 0.95
    32: 0.92
    33: 0.89
    34: 0.85
    35: 0.81
    36: 0.77
    37: 0.72
    38: 0.67
