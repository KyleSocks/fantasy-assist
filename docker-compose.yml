# docker compose up -d --build   ->  http://marshall-home:8420
services:
  fantasy-assist:
    build: .
    image: fantasy-assist:latest
    container_name: fantasy-assist
    restart: unless-stopped
    ports:
      # LAN + Tailscale only -- the app has no login and can rewrite its
      # data (Refresh, Lists). Never port-forward this on OPNsense.
      - "8420:8000"
    environment:
      - TZ=America/New_York
    volumes:
      - ./data:/app/data          # hockey.db, roster / free-agent / league files
      - ./config:/app/config:ro   # league + model settings: edit on the host, no rebuild
    # Hardening: nothing in the container needs to write outside ./data,
    # gain privileges, or use Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    # keep docker's logs from slowly filling the ZimaBoard's eMMC
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
