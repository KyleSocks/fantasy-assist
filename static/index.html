<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>Draft board · Fantasy Assist</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/vendor/uPlot.min.css">
  <link rel="stylesheet" href="/static/ui.css">
  <link rel="stylesheet" href="/static/board.css">
</head>
<body class="board-page" data-mview="board">
  <header class="boards">
    <h1 class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path class="stick" d="M13 6 L41 44 Q44 49 53 49" stroke-width="5"/>
          <path class="stick" d="M51 6 L23 44 Q20 49 11 49" stroke-width="5"/>
          <path class="tape-a" d="M13 6 L16.5 10.8" stroke-width="5.6"/>
          <path class="tape-b" d="M51 6 L47.5 10.8" stroke-width="5.6"/>
        </g>
        <ellipse class="puck" cx="32" cy="57" rx="11" ry="4.5"/>
      </svg>
      <span class="brand-text"><span class="brand-team">Marshall &amp; Co.</span><span class="brand-page">Draft board</span></span>
    </h1>
    <nav class="pages" aria-label="Pages">
      <a class="page on" href="/" aria-current="page">Draft</a><a class="page" href="/inseason">Mid-season</a>
    </nav>
    <button type="button" class="icon-btn theme-btn" aria-pressed="false" aria-label="Dark theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
    <div class="controls">
      <select id="league" aria-label="League"></select>
      <input id="search" type="search" placeholder="Search players" aria-label="Search players" class="grow">
      <div id="chips" class="chips" role="group" aria-label="Position filter"></div>
      <button id="reset" type="button" class="quiet" title="Clear every pick">Reset draft</button>
    </div>
  </header>

  <nav class="mview" aria-label="View">
    <button type="button" class="mtab active" data-view="board">Board</button>
    <button type="button" class="mtab" data-view="recs">Picks</button>
    <button type="button" class="mtab" data-view="roster">Roster</button>
    <button type="button" class="mtab" data-view="drafted">Drafted</button>
  </nav>

  <main class="layout">
    <aside class="side" aria-label="Draft sidebar">
      <div id="round" class="round">Round 1</div>
      <nav class="tabs side-tabs" aria-label="Sidebar">
        <button type="button" class="tab active" data-tab="recs">Picks</button>
        <button type="button" class="tab" data-tab="roster">My roster</button>
        <button type="button" class="tab" data-tab="drafted">Drafted</button>
      </nav>
      <div id="tab-recs" class="tab-panel" role="tabpanel">
        <div id="recs" class="recs">
          <div class="rec-empty">Loading recommendations…</div>
        </div>
      </div>
      <div id="tab-roster" class="tab-panel" hidden role="tabpanel">
        <div id="roster" class="roster"></div>
        <div class="paster">
          <label for="paster">Log a pick by name (Enter takes the best match)</label>
          <input id="paster" type="text" placeholder="Paste or type a name" autocomplete="off">
          <div class="chips dest-toggle" role="group" aria-label="Pick goes to">
            <button type="button" class="chip dest active" data-dest="taken">Taken</button>
            <button type="button" class="chip dest" data-dest="me">Me</button>
          </div>
          <div id="paster-list" class="paster-list"></div>
          <div id="paster-status" class="paster-status muted"></div>
        </div>
      </div>
      <div id="tab-drafted" class="tab-panel" hidden role="tabpanel">
        <ol id="draft-log" class="draft-log"></ol>
      </div>
    </aside>

    <section class="board-wrap">
      <div id="status" class="status">Loading…</div>
      <label class="board-sort">Sort by <select id="board-sort"></select></label>
      <div class="board-scroll">
        <table class="board">
          <thead id="board-head"><tr></tr></thead>
          <tbody id="board-body"></tbody>
        </table>
      </div>
      <button type="button" id="board-more" class="board-more" hidden>Show more players</button>
    </section>
  </main>

  <aside id="player-panel" class="player-panel" hidden aria-label="Player details">
    <div class="panel-head">
      <div>
        <h2 id="panel-name" class="panel-title"></h2>
        <div id="panel-meta" class="panel-meta muted"></div>
      </div>
      <button id="panel-close" type="button" class="panel-close">Close</button>
    </div>
    <div id="panel-body" class="panel-body"></div>
  </aside>

  <script src="/static/board.js"></script>
  <script src="/static/vendor/uPlot.iife.min.js"></script>
  <script src="/static/detail.js"></script>
</body>
</html>
